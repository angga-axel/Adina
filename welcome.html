<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selamat Datang ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

overflow:hidden;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(135deg,#090909,#22092C,#3B185F);

color:white;

}

/* ===========================
        Bintang
=========================== */

.stars{

position:absolute;
width:100%;
height:100%;
overflow:hidden;

}

.star{

position:absolute;

background:white;

border-radius:50%;

animation:blink 3s infinite;

}

@keyframes blink{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

}

}

/* ===========================
        Hati
=========================== */

.heart{

position:absolute;

color:#ff5b8a;

animation:heartMove linear infinite;

opacity:.8;

}

@keyframes heartMove{

0%{

transform:translateY(110vh) scale(.5);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120px) scale(1.3);

opacity:0;

}

}

/* ===========================
      Container
=========================== */

.card{

position:relative;

z-index:5;

width:90%;
max-width:750px;

padding:50px;

text-align:center;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

border:1px solid rgba(255,255,255,.2);

box-shadow:0 0 60px rgba(255,0,120,.25);

animation:fade 1.5s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-size:48px;

margin-bottom:20px;

text-shadow:0 0 25px #ff5b8a;

}

#typing{

font-size:22px;

line-height:1.8;

min-height:90px;

margin-bottom:35px;

}

button{

padding:15px 35px;

font-size:18px;

border:none;

border-radius:40px;

cursor:pointer;

margin:10px;

transition:.3s;

}

#musicBtn{

background:white;

color:#ff4d6d;

}

#nextBtn{

background:#ff4d6d;

color:white;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 25px #ff5b8a;

}

footer{

margin-top:30px;

opacity:.5;

font-size:13px;

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<div id="hearts"></div>

<div class="card">

<h1>❤️ Hai Cantik ❤️</h1>

<p id="typing"></p>

<button id="musicBtn">
🎵 Putar Musik
</button>

<button id="nextBtn">
🎁 Buka Hadiah
</button>

<footer>

Made with love, just for you ❤️

</footer>

</div>

<!-- Ganti nanti dengan lagu milikmu -->
<audio id="bgm" loop>
<source src="music/music.mp3" type="audio/mpeg">
</audio>

<script>

/* ======================
      STAR
====================== */

const stars=document.getElementById("stars");

for(let i=0;i<220;i++){

let s=document.createElement("div");

s.className="star";

let size=Math.random()*3+1;

s.style.width=size+"px";
s.style.height=size+"px";

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*5+"s";

stars.appendChild(s);

}

/* ======================
      HEART
====================== */

const hearts=document.getElementById("hearts");

function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(6+Math.random()*5)+"s";

hearts.appendChild(h);

setTimeout(()=>{

h.remove();

},11000);

}

setInterval(createHeart,250);

/* ======================
      Typing
====================== */

const text=
"Hari ini bukan hari biasa. Ada seseorang yang sudah menyiapkan sesuatu yang spesial hanya untukmu. Semoga setelah melihat semuanya, kamu akan tersenyum. ❤️";

let i=0;

function typing(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,45);

}

}

typing();

/* ======================
      MUSIC
====================== */

const music=document.getElementById("bgm");

document.getElementById("musicBtn").onclick=function(){

music.play();

this.innerHTML="🎵 Musik Diputar";

}

/* ======================
      NEXT
====================== */

document.getElementById("nextBtn").onclick=function(){

document.body.style.transition=".8s";

document.body.style.opacity="0";

setTimeout(()=>{

window.location.href="letter.html";

},800);

}

</script>

</body>
</html>
