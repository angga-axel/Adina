<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selamat Datang ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,#090909,#22092C,#3B185F);

    color:white;
}

/* =========================
        BINTANG
========================= */

.stars{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:blink 3s infinite;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
    }

    50%{
        opacity:1;
    }
}

/* =========================
        HATI
========================= */

.heart{
    position:absolute;
    color:#ff5b8a;
    animation:heartMove linear infinite;
    opacity:.8;
}

@keyframes heartMove{

    0%{
        transform:translateY(110vh) scale(.5);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-120px) scale(1.3);
        opacity:0;
    }

}

/* =========================
        CARD
========================= */

.card{

    position:relative;

    z-index:5;

    width:90%;
    max-width:750px;

    padding:50px;

    text-align:center;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.2);

    box-shadow:
    0 0 60px rgba(255,0,120,.25);

    animation:fade 1.5s;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =========================
        TITLE
========================= */

h1{

    font-size:48px;

    margin-bottom:20px;

    text-shadow:
    0 0 25px #ff5b8a;

}

#typing{

    font-size:22px;

    line-height:1.8;

    min-height:90px;

    margin-bottom:35px;

}

/* =========================
        BUTTON
========================= */

button{

    padding:15px 35px;

    font-size:18px;

    border:none;

    border-radius:40px;

    cursor:pointer;

    margin:10px;

    transition:.3s;

}

button:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 25px #ff5b8a;

}

/* =========================
      NEXT BUTTON
========================= */

#nextBtn{

    background:#ff4d6d;

    color:white;

}

/* =========================
      MUSIC PLAYER
========================= */

.music-player{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    z-index:100;

    width:90%;

    max-width:430px;

    padding:14px 18px;

    display:flex;

    align-items:center;

    gap:12px;

    background:rgba(20,10,30,.75);

    backdrop-filter:blur(15px);

    border:

    1px solid rgba(255,255,255,.18);

    border-radius:50px;

    box-shadow:

    0 0 30px rgba(255,77,109,.25);

}

/* =========================
      PLAY BUTTON
========================= */

#musicBtn{

    width:48px;

    height:48px;

    padding:0;

    margin:0;

    flex-shrink:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#ff4d6d;

    color:white;

    border-radius:50%;

    font-size:20px;

}

/* =========================
      MUSIC INFO
========================= */

.music-info{

    flex:1;

    text-align:left;

    min-width:0;

}

.music-title{

    font-size:14px;

    font-weight:500;

}

.music-status{

    font-size:11px;

    opacity:.6;

}

/* =========================
      EQUALIZER
========================= */

.equalizer{

    display:flex;

    align-items:flex-end;

    gap:3px;

    height:22px;

    margin-right:5px;

}

.equalizer span{

    width:3px;

    height:8px;

    background:#ff5b8a;

    border-radius:5px;

    opacity:.4;

}

/* Equalizer bergerak saat musik aktif */

.music-playing .equalizer span:nth-child(1){

    animation:eq 0.7s infinite alternate;

}

.music-playing .equalizer span:nth-child(2){

    animation:eq 0.5s infinite alternate;

}

.music-playing .equalizer span:nth-child(3){

    animation:eq 0.8s infinite alternate;

}

.music-playing .equalizer span:nth-child(4){

    animation:eq 0.6s infinite alternate;

}

@keyframes eq{

    from{
        height:5px;
        opacity:.4;
    }

    to{
        height:22px;
        opacity:1;
    }

}

/* =========================
        VOLUME
========================= */

.volume{

    width:70px;

}

#volumeSlider{

    width:100%;

    accent-color:#ff4d6d;

    cursor:pointer;

}

/* =========================
        FOOTER
========================= */

footer{

    margin-top:30px;

    opacity:.5;

    font-size:13px;

}

/* =========================
      RESPONSIVE HP
========================= */

@media(max-width:600px){

    .card{

        padding:35px 20px;

    }

    h1{

        font-size:34px;

    }

    #typing{

        font-size:17px;

    }

    .music-player{

        bottom:15px;

        width:94%;

    }

    .volume{

        width:55px;

    }

}

</style>

</head>

<body>

<!-- =========================
        BINTANG
========================= -->

<div class="stars" id="stars"></div>

<!-- =========================
        HATI
========================= -->

<div id="hearts"></div>


<!-- =========================
        CARD
========================= -->

<div class="card">

    <h1>❤️ Hai Cantik ❤️</h1>

    <p id="typing"></p>

    <button id="nextBtn">
        🎁 Buka Hadiah
    </button>

    <footer>
        Made with love, just for you ❤️
    </footer>

</div>


<!-- =========================
        MUSIC
========================= -->

<audio id="bgm" loop preload="auto">

    <source
        src="music/music.mp3"
        type="audio/mpeg">

</audio>


<!-- =========================
      MUSIC PLAYER
========================= -->

<div class="music-player" id="musicPlayer">

    <button id="musicBtn">

        ▶️

    </button>


    <div class="music-info">

        <div class="music-title">

            🎵 Lagu Untukmu

        </div>

        <div
            class="music-status"
            id="musicStatus">

            Musik dimatikan

        </div>

    </div>


    <div class="equalizer">

        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <div class="volume">

        <input
            type="range"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.7">

    </div>

</div>


<script>

/* =========================
        STAR
========================= */

const stars =
document.getElementById("stars");

for(let i=0;i<220;i++){

    let s =
    document.createElement("div");

    s.className="star";

    let size =
    Math.random()*3+1;

    s.style.width =
    size+"px";

    s.style.height =
    size+"px";

    s.style.left =
    Math.random()*100+"%";

    s.style.top =
    Math.random()*100+"%";

    s.style.animationDelay =
    Math.random()*5+"s";

    stars.appendChild(s);

}


/* =========================
        HEART
========================= */

const hearts =
document.getElementById("hearts");


function createHeart(){

    let h =
    document.createElement("div");

    h.className="heart";

    h.innerHTML="❤️";

    h.style.left =
    Math.random()*100+"vw";

    h.style.fontSize =
    (15+Math.random()*25)+"px";

    h.style.animationDuration =
    (6+Math.random()*5)+"s";

    hearts.appendChild(h);


    setTimeout(()=>{

        h.remove();

    },11000);

}


setInterval(createHeart,250);


/* =========================
        TYPING
========================= */

const text =
"Hari ini bukan hari biasa. Ada seseorang yang sudah menyiapkan sesuatu yang spesial hanya untukmu. Semoga setelah melihat semuanya, kamu akan tersenyum. ❤️";


let i=0;


function typing(){

    if(i<text.length){

        document
        .getElementById("typing")
        .innerHTML +=
        text.charAt(i);

        i++;

        setTimeout(
            typing,
            45
        );

    }

}


typing();


/* =========================
        MUSIC
========================= */

const music =
document.getElementById("bgm");

const musicBtn =
document.getElementById("musicBtn");

const musicStatus =
document.getElementById("musicStatus");

const musicPlayer =
document.getElementById("musicPlayer");

const volumeSlider =
document.getElementById("volumeSlider");


/* =========================
      VOLUME AWAL
========================= */

const savedVolume =
localStorage.getItem(
    "musicVolume"
);


if(savedVolume !== null){

    music.volume =
    parseFloat(savedVolume);

    volumeSlider.value =
    savedVolume;

}else{

    music.volume = 0.7;

}


/* =========================
      POSISI LAGU
========================= */

const savedTime =
localStorage.getItem(
    "musicTime"
);


if(savedTime !== null){

    music.addEventListener(
        "loadedmetadata",
        function(){

            if(
                parseFloat(savedTime)
                <
                music.duration
            ){

                music.currentTime =
                parseFloat(savedTime);

            }

        },
        {once:true}
    );

}


/* =========================
      UPDATE PLAYER
========================= */

function updateMusicUI(){

    if(!music.paused){

        musicBtn.innerHTML =
        "⏸️";

        musicStatus.innerHTML =
        "Sedang diputar ❤️";

        musicPlayer
        .classList
        .add("music-playing");

    }else{

        musicBtn.innerHTML =
        "▶️";

        musicStatus.innerHTML =
        "Musik dijeda";

        musicPlayer
        .classList
        .remove("music-playing");

    }

}


/* =========================
      PLAY / PAUSE
========================= */

musicBtn.addEventListener(
    "click",
    async function(){

        try{

            if(music.paused){

                await music.play();

            }else{

                music.pause();

            }

            updateMusicUI();

        }catch(error){

            console.log(
                "Musik tidak dapat diputar:",
                error
            );

            musicStatus.innerHTML =
            "Tekan tombol untuk memutar";

        }

    }
);


/* =========================
      VOLUME
========================= */

volumeSlider.addEventListener(
    "input",
    function(){

        music.volume =
        parseFloat(this.value);

        localStorage.setItem(
            "musicVolume",
            this.value
        );

    }
);


/* =========================
      SIMPAN POSISI LAGU
========================= */

music.addEventListener(
    "timeupdate",
    function(){

        localStorage.setItem(
            "musicTime",
            music.currentTime
        );

    }
);


/* =========================
      SAAT LAGU SELESAI
========================= */

music.addEventListener(
    "ended",
    function(){

        localStorage.removeItem(
            "musicTime"
        );

        updateMusicUI();

    }
);


/* =========================
      UPDATE STATUS
========================= */

music.addEventListener(
    "play",
    updateMusicUI
);

music.addEventListener(
    "pause",
    updateMusicUI
);


/* =========================
        NEXT
========================= */

document
.getElementById("nextBtn")
.addEventListener(
    "click",
    function(){

        document.body.style.transition =
        ".8s";

        document.body.style.opacity =
        "0";


        /*
        Simpan posisi terakhir
        sebelum pindah halaman
        */

        localStorage.setItem(
            "musicTime",
            music.currentTime
        );


        setTimeout(()=>{

            window.location.href =
            "story.html";

        },800);

    }
);


/* =========================
      INITIAL UI
========================= */

updateMusicUI();

</script>

</body>
</html>
