<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kenangan Kita ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#090909,#1f1147,#070b34);

overflow:hidden;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

/* ========================= */

.stars{

position:absolute;

width:100%;
height:100%;

background-image:
radial-gradient(white 1px,transparent 1px);

background-size:40px 40px;

opacity:.15;

animation:move 120s linear infinite;

}

@keyframes move{

from{

transform:translateY(0);

}

to{

transform:translateY(900px);

}

}

/* ========================= */

.heart{

position:absolute;

color:#ff5d8f;

animation:heart linear forwards;

}

@keyframes heart{

0%{

transform:translateY(110vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120px);

opacity:0;

}

}

/* ========================= */

.container{

position:relative;

z-index:5;

width:90%;

max-width:900px;

padding:35px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:25px;

text-align:center;

box-shadow:0 0 40px rgba(255,0,100,.2);

}

h1{

font-size:42px;

margin-bottom:20px;

color:#ff82a9;

}

.slider{

position:relative;

margin:auto;

width:100%;

height:450px;

overflow:hidden;

border-radius:20px;

}

.slider img{

width:100%;

height:100%;

object-fit:cover;

border-radius:20px;

transition:1s;

box-shadow:0 0 25px rgba(255,255,255,.3);

}

.caption{

margin-top:20px;

font-size:20px;

min-height:60px;

}

.controls{

margin-top:25px;

}

button{

padding:14px 28px;

margin:10px;

font-size:18px;

border:none;

border-radius:40px;

cursor:pointer;

transition:.3s;

}

.prev{

background:white;

color:#ff4d6d;

}

.next{

background:#ff4d6d;

color:white;

}

button:hover{

transform:scale(1.08);

}

.footer{

margin-top:20px;

}

</style>

</head>

<body>

<div class="stars"></div>

<div id="hearts"></div>

<div class="container">

<h1>📸 Kenangan Kita ❤️</h1>

<div class="slider">

<img id="photo" src="image/foto1.jpg">

</div>

<div class="caption" id="caption">

Awal dari semua cerita indah kita ❤️

</div>

<div class="controls">

<button class="prev" onclick="prevPhoto()">

⬅ Sebelumnya

</button>

<button class="next" onclick="nextPhoto()">

Selanjutnya ➡

</button>

</div>

<div class="footer">

<button class="next" onclick="window.location='reasons.html'">

💖 100 Alasan Aku Sayang Kamu

</button>

</div>

</div>

<script>

/* ==========================
HATI
========================== */

const hearts=document.getElementById("hearts");

function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*20)+"px";

h.style.animationDuration=(6+Math.random()*5)+"s";

hearts.appendChild(h);

setTimeout(()=>{

h.remove();

},11000);

}

setInterval(createHeart,250);

/* ==========================
GALERI
========================== */

const photos=[

"image/foto1.jpg",

"image/foto2.jpg",

"image/foto3.jpg",

"image/foto4.jpg",

"image/foto5.jpg"

];

const captions=[

"Awal dari semua cerita indah kita ❤️",

"Senyummu selalu jadi favoritku 😊",

"Terima kasih sudah hadir di hidupku 🌹",

"Setiap foto punya cerita yang tak akan kulupakan 💖",

"Semoga album ini terus bertambah sampai tua nanti 🤍"

];

let index=0;

const img=document.getElementById("photo");

const text=document.getElementById("caption");

function show(){

img.style.opacity=0;

setTimeout(()=>{

img.src=photos[index];

text.innerHTML=captions[index];

img.style.opacity=1;

},300);

}

function nextPhoto(){

index++;

if(index>=photos.length){

index=0;

}

show();

}

function prevPhoto(){

index--;

if(index<0){

index=photos.length-1;

}

show();

}

/* Auto Slide */

setInterval(nextPhoto,5000);

</script>

</body>
</html>
